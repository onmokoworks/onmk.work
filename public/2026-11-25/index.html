<style>
  html, body { margin: 0; height: 100%; background: #fff; color: #111; overflow: hidden; }
  /* Two identical halves; sliding by one half loops without a seam. */
  .flow {
    position: absolute; top: 0; left: 0; height: 100%;
    display: flex; align-items: center; white-space: nowrap;
    font: 900 70vh/1 "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Noto Sans CJK JP", "Yu Gothic", Meiryo, sans-serif;
    -webkit-animation: flow 14s linear infinite; animation: flow 14s linear infinite;
    will-change: transform;
  }
  .flow span { padding-right: 1em; }
  @-webkit-keyframes flow { to { -webkit-transform: translateX(-50%); } }
  @keyframes flow { to { transform: translateX(-50%); } }
</style>
