<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>有志ラボ選択相談会</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #fff; color: #111; overflow: hidden; overscroll-behavior: none; }
  canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
</style>
<canvas role="marquee" aria-label="有志ラボ選択相談会"></canvas>
<script src="data.js"></script>
<script>
// A banner that flows right to left. Scrolling sideways (swipe, drag, arrow keys) pushes
// the flow and folds the strokes away for a moment; they unfold again right away,
// even while the scrolling goes on.
// Plain script and old syntax on purpose: this also has to run on old phones.
(function () {
  var banner = window.BANNER, canvas = document.querySelector('canvas'), context = canvas.getContext('2d');
  var color = getComputedStyle(canvas).color;
  var characters = Array.from(banner.text).map(function (character) { return banner.glyphs[character]; });
  var GAP = 400, SPEED = 290, HEIGHT = .7; // units between repeats, units per second, glyph height / screen height
  var starts = [], period = 0;
  characters.forEach(function (glyph) { starts.push(period); period += glyph.advance; });
  period += GAP;

  var width, height, scale, ratio;
  function resize() {
    width = innerWidth; height = innerHeight; ratio = Math.min(window.devicePixelRatio || 1, 2);
    scale = height * HEIGHT / 400;
    canvas.width = Math.round(width * ratio); canvas.height = Math.round(height * ratio);
  }

  // Scroll input, in screen pixels. It moves the text and feeds the fold.
  var offset = 0, push = 0, held = 0, folded = 0, trail = [], last = performance.now();
  // A slide starts one short pulse. Devices report slides very differently (a few
  // big steps or a long stream of small ones), so the pulse has a fixed length and
  // a new one can start only after the strokes are mostly back.
  function scrolled(pixels) {
    offset += pixels / scale;
    if (held <= 0 && folded < .12) { held = .2; push = .75; }
    if (held > 0) push = Math.min(1, push + Math.abs(pixels) / 160);
  }
  addEventListener('wheel', function (event) {
    var unit = event.deltaMode === 1 ? 32 : event.deltaMode === 2 ? height : 1;
    // Only sideways movement counts; vertical scrolling is ignored on purpose.
    if (event.deltaX) scrolled(event.deltaX * unit);
    if (event.cancelable) event.preventDefault();
  }, {passive: false});
  // A finger or mouse drag measures its own speed; letting go hands that speed to
  // the glide, which keeps the text sliding and fades out over a couple of seconds.
  var glide = 0, speed = 0, moved = 0;
  function dragged(pixels) {
    var now = performance.now(), dt = (now - moved) / 1000; moved = now;
    if (dt > 0 && dt < .2) speed = .3 * speed + .7 * Math.max(-9000, Math.min(9000, pixels / dt)); else speed = 0;
    glide = 0; scrolled(pixels);
  }
  function released() { glide = performance.now() - moved < 120 ? speed : 0; speed = 0; }
  var touch = null;
  addEventListener('touchstart', function (event) { var t = event.changedTouches[0]; touch = {id: t.identifier, x: t.clientX}; glide = 0; speed = 0; moved = performance.now(); }, {passive: true});
  addEventListener('touchmove', function (event) {
    for (var i = 0; touch && i < event.changedTouches.length; i++) {
      var t = event.changedTouches[i]; if (t.identifier !== touch.id) continue;
      dragged(touch.x - t.clientX); touch.x = t.clientX;
    }
    if (event.cancelable) event.preventDefault();
  }, {passive: false});
  addEventListener('touchend', function () { if (touch) released(); touch = null; }); addEventListener('touchcancel', function () { touch = null; speed = 0; });
  // Dragging sideways with a mouse scrolls too; the text follows the pointer.
  var grab = null;
  canvas.addEventListener('mousedown', function (event) { if (event.button === 0) { grab = event.clientX; glide = 0; speed = 0; moved = performance.now(); canvas.style.cursor = 'grabbing'; event.preventDefault(); } });
  addEventListener('mousemove', function (event) { if (grab !== null) { dragged(grab - event.clientX); grab = event.clientX; } });
  addEventListener('mouseup', function () { if (grab !== null) released(); grab = null; canvas.style.cursor = ''; });
  addEventListener('keydown', function (event) {
    var step = {ArrowRight: 120, ArrowLeft: -120}[event.key];
    if (step) { scrolled(step); glide += step * 5; event.preventDefault(); }
  });

  function ease(t) { return t * t * (3 - 2 * t); }
  // One glyph at fold progress 0..1 (1 = whole), interpolated between baked steps.
  function trace(glyph, progress, x, y) {
    var position = progress * banner.steps, step = Math.min(banner.steps - 1, Math.floor(position)), mix = position - step;
    context.beginPath();
    for (var s = 0; s < glyph.strokes.length; s++) {
      var stroke = glyph.strokes[s], size = stroke.points * 2, a = step * size, b = a + size, data = stroke.data;
      for (var i = 0; i < size; i += 2) {
        var px = x + (data[a + i] + (data[b + i] - data[a + i]) * mix) * scale / 10, py = y + (data[a + i + 1] + (data[b + i + 1] - data[a + i + 1]) * mix) * scale / 10;
        if (i) context.lineTo(px, py); else context.moveTo(px, py);
      }
    }
    context.stroke();
  }

  function draw() {
    var now = performance.now(), dt = Math.min(.05, (now - last) / 1000); last = now;
    offset += (SPEED + glide / scale) * dt; glide *= Math.exp(-dt / 1.5);
    // While the pulse is held the fold eases in; afterwards it eases back out.
    if (held > 0) { held -= dt; if (held <= 0) push = 0; }
    folded += (push - folded) * (1 - Math.exp(-dt / (push > folded ? .09 : .26)));
    trail.unshift(folded); if (trail.length > 120) trail.pop();

    context.setTransform(ratio, 0, 0, ratio, 0, 0); context.clearRect(0, 0, width, height);
    context.strokeStyle = color; context.lineCap = 'round'; context.lineJoin = 'round';
    var span = period * scale, shift = ((offset * scale) % span + span) % span, top = (height - 400 * scale) / 2;
    for (var x0 = -shift; x0 < width; x0 += span) {
      for (var c = 0; c < characters.length; c++) {
        var glyph = characters[c], x = x0 + starts[c] * scale;
        if (x > width || x + glyph.advance * scale < 0) continue;
        // Each character follows the one before it a few frames later.
        var amount = ease(Math.min(1, trail[Math.min(trail.length - 1, c * 4)] || 0)), progress = 1 - .94 * amount;
        context.lineWidth = glyph.width * scale * (.45 + .55 * progress);
        context.globalAlpha = Math.min(1, progress * 2.2);
        // Folded strokes also lift a little, as if floating off the line.
        trace(glyph, progress, x, top - amount * 36 * scale);
      }
    }
    (window.requestAnimationFrame || function (callback) { setTimeout(callback, 16); })(draw);
  }
  resize(); addEventListener('resize', resize); draw();
})();
</script>
</html>
